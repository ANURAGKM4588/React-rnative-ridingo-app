name: Build Production Mobile Packages (iOS & Android)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # =============================================================
  # 1. ANDROID BUILDS: Ridingo-User.apk & Ridingo-Driver.apk
  # =============================================================
  build-android:
    name: Build Android APKs (User & Driver)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Create build outputs directory
        run: mkdir -p "${{ github.workspace }}/build-outputs"

      # --- Build User App Android ---
      - name: Build Ridingo-User.apk
        run: |
          echo "=== Prebuilding User App ==="
          cp app.user.json app.json
          EXPO_PUBLIC_APP_VARIANT=user npx expo prebuild --platform android --clean
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          find app/build/outputs/apk -name "*.apk" -exec cp -v {} "${{ github.workspace }}/build-outputs/Ridingo-User.apk" \;
          cd ..

      # --- Build Driver App Android ---
      - name: Build Ridingo-Driver.apk
        run: |
          echo "=== Prebuilding Driver App ==="
          cp app.driver.json app.json
          EXPO_PUBLIC_APP_VARIANT=driver npx expo prebuild --platform android --clean
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          find app/build/outputs/apk -name "*.apk" -exec cp -v {} "${{ github.workspace }}/build-outputs/Ridingo-Driver.apk" \;
          cd ..

      - name: Verify Android outputs
        run: ls -lh "${{ github.workspace }}/build-outputs"

      - name: Upload Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: Ridingo-Android-Packages
          path: |
            build-outputs/Ridingo-User.apk
            build-outputs/Ridingo-Driver.apk
          if-no-files-found: error

  # =============================================================
  # 2. IOS BUILDS: Ridingo-User.ipa & Ridingo-Driver.ipa
  # =============================================================
  build-ios:
    name: Build iOS IPAs (User & Driver)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Create build outputs directory
        run: mkdir -p "${{ github.workspace }}/build-outputs"

      # --- Build User App iOS ---
      - name: Build Ridingo-User.ipa
        run: |
          echo "=== Prebuilding User App iOS ==="
          cp app.user.json app.json
          EXPO_PUBLIC_APP_VARIANT=user npx expo prebuild --platform ios --clean
          cd ios
          pod install || pod install --repo-update || true
          
          XCWORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          XCSCHEME=$(xcodebuild -workspace "$XCWORKSPACE" -list | awk '/Schemes:/{flag=1;next} flag && !/^[[:space:]]*$/ {print $1; exit}')
          echo "Building workspace $XCWORKSPACE with scheme $XCSCHEME"
          
          xcodebuild build \
            -workspace "$XCWORKSPACE" \
            -scheme "$XCSCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES
          
          rm -rf Payload
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/*.app Payload/ || cp -r build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r -q "${{ github.workspace }}/build-outputs/Ridingo-User.ipa" Payload
          echo "✅ Ridingo-User.ipa successfully generated"
          cd ..

      # --- Build Driver App iOS ---
      - name: Build Ridingo-Driver.ipa
        run: |
          echo "=== Prebuilding Driver App iOS ==="
          cp app.driver.json app.json
          EXPO_PUBLIC_APP_VARIANT=driver npx expo prebuild --platform ios --clean
          cd ios
          pod install || pod install --repo-update || true
          
          XCWORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          XCSCHEME=$(xcodebuild -workspace "$XCWORKSPACE" -list | awk '/Schemes:/{flag=1;next} flag && !/^[[:space:]]*$/ {print $1; exit}')
          echo "Building workspace $XCWORKSPACE with scheme $XCSCHEME"
          
          xcodebuild build \
            -workspace "$XCWORKSPACE" \
            -scheme "$XCSCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES
          
          rm -rf Payload
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/*.app Payload/ || cp -r build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r -q "${{ github.workspace }}/build-outputs/Ridingo-Driver.ipa" Payload
          echo "✅ Ridingo-Driver.ipa successfully generated"
          cd ..

      - name: Verify iOS outputs
        run: ls -lh "${{ github.workspace }}/build-outputs"

      - name: Upload iOS IPAs
        uses: actions/upload-artifact@v4
        with:
          name: Ridingo-iOS-Packages
          path: |
            build-outputs/Ridingo-User.ipa
            build-outputs/Ridingo-Driver.ipa
          if-no-files-found: error

  # =============================================================
  # 3. CONSOLIDATED PRODUCTION RELEASE
  # =============================================================
  consolidate-suite:
    name: Consolidate Mobile Packages
    if: always() && (needs.build-android.result == 'success' || needs.build-ios.result == 'success')
    needs: [ build-android, build-ios ]
    runs-on: ubuntu-latest
    steps:
      - name: Create release directory
        run: mkdir -p release-packages

      - name: Download Android Artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: Ridingo-Android-Packages
          path: release-packages

      - name: Download iOS Artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: Ridingo-iOS-Packages
          path: release-packages

      - name: Verify Packages Exist
        run: |
          echo "Listing all generated standalone mobile packages:"
          ls -lh release-packages

      - name: Upload Complete Package Suite
        uses: actions/upload-artifact@v4
        with:
          name: Ridingo-Complete-Mobile-Suite
          path: release-packages/*

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-build-${{ github.run_number }}
          name: Ridingo Mobile Production Release #${{ github.run_number }}
          body: |
            ### Ridingo Native Mobile Production Packages (iOS & Android)

            Pure React Native release:

            | Application | Platform | Package File | Application / Bundle ID |
            | :--- | :--- | :--- | :--- |
            | **Ridingo (User App)** | Android | `Ridingo-User.apk` | `com.ridingo.user` |
            | **Ridingo Driver** | Android | `Ridingo-Driver.apk` | `com.ridingo.driver` |
            | **Ridingo (User App)** | iOS | `Ridingo-User.ipa` | `com.ridingo.user` |
            | **Ridingo Driver** | iOS | `Ridingo-Driver.ipa` | `com.ridingo.driver` |

            - Built from commit: `${{ github.sha }}`
          files: release-packages/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
